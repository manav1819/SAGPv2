const W = 1024, H = 720;
const gameState = {
  scenarioIndex: 0,
  score: 0,
  results: []

// =========================================================================
// HELPERS
// =========================================================================
function makeChoiceButton(scene, x, y, w, label, onClick) {
  const c = scene.add.container(x, y);
  const r = scene.add.rectangle(0, 0, w, 56, 0x1a2347)
    .setStrokeStyle(2, 0x3a4a7a, 1)
    .setInteractive({ useHandCursor: true });
  const t = scene.add.text(0, 0, label, {
    fontSize: '15px',
    fontFamily: 'Segoe UI, sans-serif',
    color: '#cdd6e3',
    align: 'center',
    wordWrap: { width: w - 30 }
  }).setOrigin(0.5);
  c.add([r, t]);
  r.on('pointerover', () => {
    r.setFillStyle(0x253261);
    r.setStrokeStyle(2, 0x00d4ff, 1);
    t.setColor('#ffffff');
  });
  r.on('pointerout', () => {
    r.setFillStyle(0x1a2347);
    r.setStrokeStyle(2, 0x3a4a7a, 1);
    t.setColor('#cdd6e3');
  });
  r.on('pointerdown', () => {
    r.setFillStyle(0x00d4ff);
    t.setColor('#0a0e27');
    scene.time.delayedCall(120, onClick);
  });
  return c;
}

function makePrimaryButton(scene, x, y, label, w, h, onClick) {
  const c = scene.add.container(x, y);
  const r = scene.add.rectangle(0, 0, w || 280, h || 56, 0x00d4ff)
    .setInteractive({ useHandCursor: true });
  const t = scene.add.text(0, 0, label, {
    fontSize: '17px',
    fontFamily: 'Segoe UI, sans-serif',
    color: '#0a0e27',
    fontStyle: 'bold'
  }).setOrigin(0.5);
  c.add([r, t]);
  r.on('pointerover', () => r.setFillStyle(0x33dfff));
  r.on('pointerout', () => r.setFillStyle(0x00d4ff));
  r.on('pointerdown', onClick);
  return c;
}

function drawGrid(scene) {
  const g = scene.add.graphics();
  g.lineStyle(1, 0x1a2347, 0.4);
  for (let x = 0; x < W; x += 40) g.lineBetween(x, 0, x, H);
  for (let y = 0; y < H; y += 40) g.lineBetween(0, y, W, y);
  return g;
}

function typewriter(scene, textObj, fullText, speed, onDone) {
  textObj.setText('');
  let i = 0;
  const evt = scene.time.addEvent({
    delay: speed,
    repeat: fullText.length - 1,
    callback: () => {
      i++;
      textObj.setText(fullText.substring(0, i));
      if (i === fullText.length && onDone) onDone();
    }
  });
  return { evt, complete: () => { evt.remove(); textObj.setText(fullText); if (onDone) onDone(); } };
}

  create() {

    this.add.text(20, 28, `SCENARIO ${gameState.scenarioIndex + 1} / ${SCENARIOS.length}`, {
      fontSize: '13px', color: '#00d4ff', fontStyle: 'bold', letterSpacing: '2px'
    }).setOrigin(0, 0.5);

    this.add.text(W/2, 28, this.scenario.title, {
      fontSize: '17px', color: '#ffffff', fontStyle: 'bold'
    }).setOrigin(0.5);

    const scoreColor = gameState.score >= 0 ? '#00ff88' : '#ff5577';
    this.add.text(W - 20, 28, `SCORE  ${gameState.score >= 0 ? '+' : ''}${gameState.score}`, {
      fontSize: '14px', color: scoreColor, fontStyle: 'bold', letterSpacing: '1px'
    }).setOrigin(1, 0.5);

    // Progress dots
    const startX = W/2 - (SCENARIOS.length - 1) * 18 / 2;
    for (let i = 0; i < SCENARIOS.length; i++) {
      const filled = i < gameState.scenarioIndex;
      const current = i === gameState.scenarioIndex;
      this.add.circle(startX + i * 18, 50, current ? 4 : 3,
        filled ? 0x00ff88 : current ? 0x00d4ff : 0x3a4a7a);
    }
  }

  clearUI() { this.uiLayer.removeAll(true); }

  showIntro() {
    this.clearUI();
    const cx = W/2, cy = H/2 + 20;

    const card = this.add.rectangle(cx, cy, 700, 420, 0x131a3d, 0.95)
      .setStrokeStyle(2, 0x00d4ff, 0.3);
    this.uiLayer.add(card);

    const icon = this.add.text(cx, cy - 145, this.scenario.icon, { fontSize: '70px' }).setOrigin(0.5);
    this.uiLayer.add(icon);

    const cat = this.add.text(cx, cy - 70, this.scenario.category.toUpperCase(), {
      fontSize: '12px', color: '#00d4ff', letterSpacing: '3px', fontStyle: 'bold'
    }).setOrigin(0.5);
    this.uiLayer.add(cat);

    const title = this.add.text(cx, cy - 35, this.scenario.title, {
      fontSize: '32px', color: '#ffffff', fontStyle: 'bold'
    }).setOrigin(0.5);
    this.uiLayer.add(title);

    const intro = this.add.text(cx, cy + 50, this.scenario.intro, {
      fontSize: '17px', color: '#cdd6e3', align: 'center', lineSpacing: 6
    }).setOrigin(0.5);
    this.uiLayer.add(intro);

    const btn = makePrimaryButton(this, cx, cy + 160, 'BEGIN  →', 200, 50, () => {
      this.showNode(this.scenario.startNode);
    });
    this.uiLayer.add(btn);

    // Fade in
    this.uiLayer.setAlpha(0);
    this.tweens.add({ targets: this.uiLayer, alpha: 1, duration: 400 });
  }

    this.uiLayer.add(avatar);

    // Speaker name
    const speaker = this.add.text(W/2 - 320, cardY - 70, node.speaker, {
      fontSize: '15px', color: '#00d4ff', fontStyle: 'bold', letterSpacing: '1px'
    }).setOrigin(0, 0.5);
    this.uiLayer.add(speaker);

    // Text body
    const bodyText = this.add.text(W/2 - 320, cardY - 40, '', {
      fontSize: '17px', color: '#e6ecf5', wordWrap: { width: 680 }, lineSpacing: 6
    }).setOrigin(0, 0);
    this.uiLayer.add(bodyText);

    // Skip-typewriter clickable area
    const skipZone = this.add.rectangle(W/2, cardY, 880, 200, 0x000000, 0.001)
      .setInteractive({ useHandCursor: false });
    this.uiLayer.add(skipZone);

    let typing = true;
    const showChoices = () => {
      typing = false;
      const choiceY = 410;
      const gap = 14;
      const btnW = 880;
      let curY = choiceY;
      node.choices.forEach((choice, i) => {
        const btn = makeChoiceButton(this, W/2, curY, btnW, choice.text, () => {
          this.handleChoice(choice);
        });
        btn.setAlpha(0);
        this.tweens.add({ targets: btn, alpha: 1, duration: 300, delay: i * 100 });
        this.uiLayer.add(btn);
        curY += 56 + gap;
      });
    };

    const tw = typewriter(this, bodyText, node.text, 18, showChoices);
    skipZone.on('pointerdown', () => {
      if (typing) tw.complete();
    });
  }

  handleChoice(choice) {
    gameState.score += choice.points;
    this.showNode(choice.next);
  }

  showOutcome(node) {
    this.clearUI();
    const cx = W/2, cy = H/2 + 20;

    let color, accent, glow, badge;
    if (node.outcome === 'breach') {
      color = 0xff5577; accent = '#ff5577'; glow = 0xff5577; badge = '✗  BREACH';
    } else if (node.outcome === 'partial') {
      color = 0xffaa44; accent = '#ffaa44'; glow = 0xffaa44; badge = '~  PARTIAL';
    } else {
      color = 0x00ff88; accent = '#00ff88'; glow = 0x00ff88; badge = '✓  PROTECTED';
    }

    // Glow pulse
    const ring = this.add.circle(cx, cy - 130, 60, glow, 0.15);
    this.tweens.add({ targets: ring, scale: 1.5, alpha: 0, duration: 1200, repeat: -1 });
    this.uiLayer.add(ring);

    const card = this.add.rectangle(cx, cy, 760, 470, 0x131a3d, 0.97)
      .setStrokeStyle(3, color, 0.7);
    this.uiLayer.add(card);

    const badgeBg = this.add.rectangle(cx, cy - 175, 220, 36, color, 0.18)
      .setStrokeStyle(1, color, 0.7);
    this.uiLayer.add(badgeBg);
    const badgeT = this.add.text(cx, cy - 175, badge, {
      fontSize: '14px', color: accent, fontStyle: 'bold', letterSpacing: '3px'
    }).setOrigin(0.5);
    this.uiLayer.add(badgeT);

    const title = this.add.text(cx, cy - 130, node.title, {
      fontSize: '34px', color: '#ffffff', fontStyle: 'bold'
    }).setOrigin(0.5);
    this.uiLayer.add(title);

    // Divider
    const div = this.add.rectangle(cx, cy - 90, 600, 1, 0xffffff, 0.15);
    this.uiLayer.add(div);

    // What happened
    const whatLabel = this.add.text(cx - 340, cy - 65, 'WHAT HAPPENED', {
      fontSize: '11px', color: '#8892b0', fontStyle: 'bold', letterSpacing: '2px'
    }).setOrigin(0, 0);
    this.uiLayer.add(whatLabel);
    const summary = this.add.text(cx - 340, cy - 42, node.summary, {
      fontSize: '15px', color: '#cdd6e3', wordWrap: { width: 680 }, lineSpacing: 5
    }).setOrigin(0, 0);
    this.uiLayer.add(summary);

    // Takeaway
    const lessonLabel = this.add.text(cx - 340, cy + 60, 'TAKEAWAY', {
      fontSize: '11px', color: accent, fontStyle: 'bold', letterSpacing: '2px'
    }).setOrigin(0, 0);
    this.uiLayer.add(lessonLabel);
    const lesson = this.add.text(cx - 340, cy + 84, node.lesson, {
      fontSize: '15px', color: '#e6ecf5', wordWrap: { width: 680 }, lineSpacing: 5,
      fontStyle: 'italic'
    }).setOrigin(0, 0);
    this.uiLayer.add(lesson);

    const isLast = gameState.scenarioIndex >= SCENARIOS.length - 1;
    const btnLabel = isLast ? 'SEE FINAL RESULTS  →' : 'NEXT SCENARIO  →';
    const btn = makePrimaryButton(this, cx, cy + 195, btnLabel, 280, 52, () => {
      gameState.results.push({
        title: this.scenario.title,
        outcome: node.outcome,
        category: this.scenario.category
      });
      gameState.scenarioIndex++;
      if (isLast) this.scene.start('EndScene');
      else this.scene.restart();
    });
    this.uiLayer.add(btn);

    this.uiLayer.setAlpha(0);
    this.tweens.add({ targets: this.uiLayer, alpha: 1, duration: 500 });
  }
}

// =========================================================================
// END SCENE
// =========================================================================
class EndScene extends Phaser.Scene {
  constructor() { super({ key: 'EndScene' }); }

  create() {
    drawGrid(this);

    // Score → rating
    const score = gameState.score;
    let rating, ratingColor, ratingDesc;
    if (score >= 65) {
      rating = 'CYBER SENTINEL'; ratingColor = '#00ff88';
      ratingDesc = 'Exemplary defense. You spotted the manipulation\nand held the line every time.';
    } else if (score >= 35) {
      rating = 'INFORMED DEFENDER'; ratingColor = '#00d4ff';
      ratingDesc = 'Solid instincts. A few risky moments,\nbut you avoided the worst outcomes.';
    } else if (score >= 0) {
      rating = 'AWARE APPRENTICE'; ratingColor = '#ffaa44';
      ratingDesc = 'You\'re catching on. Review the takeaways —\nthe red flags were there.';
    } else {
      rating = 'TARGETED'; ratingColor = '#ff5577';
      ratingDesc = 'Multiple breaches. Re-run the scenarios —\nthe attackers were counting on you.';
    }

    this.add.text(W/2, 70, 'TRAINING COMPLETE', {
      fontSize: '15px', color: '#8892b0', letterSpacing: '4px'
    }).setOrigin(0.5);

    this.add.text(W/2, 130, rating, {
      fontSize: '46px', color: ratingColor, fontStyle: 'bold',
      stroke: '#0a0e27', strokeThickness: 2
    }).setOrigin(0.5);

    this.add.text(W/2, 195, ratingDesc, {
      fontSize: '15px', color: '#cdd6e3', align: 'center', lineSpacing: 6
    }).setOrigin(0.5);

    // Score badge
    const scoreCard = this.add.rectangle(W/2, 280, 280, 70, 0x131a3d, 0.95)
      .setStrokeStyle(2, ratingColor, 0.7);
    this.add.text(W/2 - 70, 280, 'SCORE', {
      fontSize: '14px', color: '#8892b0', letterSpacing: '2px'
    }).setOrigin(0.5);
    this.add.text(W/2 + 50, 280, (score >= 0 ? '+' : '') + score, {
      fontSize: '36px', color: ratingColor, fontStyle: 'bold'
    }).setOrigin(0.5);

    // Per-scenario summary
    this.add.text(W/2, 355, 'YOUR DECISIONS', {
      fontSize: '12px', color: '#8892b0', letterSpacing: '3px', fontStyle: 'bold'
    }).setOrigin(0.5);

    const startY = 390;
    const rowH = 44;
    gameState.results.forEach((r, i) => {
      const y = startY + i * rowH;
      this.add.rectangle(W/2, y, 700, 38, 0x131a3d, 0.7).setStrokeStyle(1, 0x3a4a7a, 0.4);

      let badge, badgeColor;
      if (r.outcome === 'safe') { badge = '✓'; badgeColor = '#00ff88'; }
      else if (r.outcome === 'partial') { badge = '~'; badgeColor = '#ffaa44'; }
      else { badge = '✗'; badgeColor = '#ff5577'; }

      this.add.text(W/2 - 320, y, badge, {
        fontSize: '20px', color: badgeColor, fontStyle: 'bold'
      }).setOrigin(0.5);

      this.add.text(W/2 - 290, y, r.title, {
        fontSize: '15px', color: '#ffffff', fontStyle: 'bold'
      }).setOrigin(0, 0.5);

      this.add.text(W/2 + 320, y, r.category, {
        fontSize: '12px', color: '#8892b0', letterSpacing: '1px'
      }).setOrigin(1, 0.5);
    });

    // Buttons
    makePrimaryButton(this, W/2 - 110, H - 60, '↻  PLAY AGAIN', 200, 48, () => {
      gameState.scenarioIndex = 0;
      gameState.score = 0;
      gameState.results = [];
      this.scene.start('ScenarioScene');
    });

    const homeBtn = this.add.container(W/2 + 110, H - 60);
    const hr = this.add.rectangle(0, 0, 200, 48, 0x1a2347)
      .setStrokeStyle(2, 0x3a4a7a, 1)
      .setInteractive({ useHandCursor: true });
    const ht = this.add.text(0, 0, 'HOME', {
      fontSize: '15px', color: '#cdd6e3', fontStyle: 'bold', letterSpacing: '3px'
    }).setOrigin(0.5);
    homeBtn.add([hr, ht]);
    hr.on('pointerover', () => { hr.setFillStyle(0x253261); hr.setStrokeStyle(2, 0x00d4ff, 1); });
    hr.on('pointerout', () => { hr.setFillStyle(0x1a2347); hr.setStrokeStyle(2, 0x3a4a7a, 1); });
    hr.on('pointerdown', () => this.scene.start('MenuScene'));
  }
}

// =========================================================================
// BOOT
// =========================================================================
const config = {
  type: Phaser.AUTO,
  width: W,
  height: H,
  parent: 'game',
  backgroundColor: '#0a0e27',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [MenuScene, ScenarioScene, EndScene]
};

new Phaser.Game(config);
</script>
</body>
</html>
