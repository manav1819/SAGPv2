<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Cyber anvil and circuit spark badge">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#0891B2"/>
        <stop offset="1" stop-color="#22D3EE"/>
      </linearGradient>
      <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
        <stop offset="0.45" stop-color="#DCE7F4" stop-opacity="0.75"/>
        <stop offset="1" stop-color="#7C8CA3" stop-opacity="0.95"/>
      </linearGradient>
      <radialGradient id="shine" cx="35%" cy="28%" r="70%">
        <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
        <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
        <stop offset="1" stop-color="#000000" stop-opacity="0.2"/>
      </radialGradient>
      <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
