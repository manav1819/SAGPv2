<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAGP Game</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a1a;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            overflow: hidden;
        }
        #game {
            background: #000;
            border: 2px solid #333;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
            max-width: 100vw;
            max-height: 100vh;
        }
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: #fff;
            z-index: 9999;
            flex-direction: column;
            gap: 20px;
        }
        .spinner {
            border: 4px solid #333;
            border-top: 4px solid #0ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="game"></div>
    <div id="loading">
        <div class="spinner"></div>
        <div>Loading Game...</div>
    </div>

    <script>
        // Game EventHandler for client-side event management
        class GameEventHandler {
            constructor(tokenId) {
                this.tokenId = tokenId;
                this.events = [];
                this.batchInterval = setInterval(() => this.flushEvents(), 30000);
            }

            addEvent(tokenId, eventType, data) {
                this.events.push({
                    event_type: eventType,
                    timestamp: Date.now(),
                    data: data || {}
                });
            }

            updateScore(tokenId, score, maxScore) {
                fetch('/api/save-state', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token_id: tokenId,
                        score: score,
                        max_score: maxScore
                    })
                }).catch(err => console.error('Failed to save score:', err));
            }

            completeSession(tokenId) {
                clearInterval(this.batchInterval);
                this.flushEvents();

                setTimeout(() => {
                    fetch('/api/game/complete', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token_id: tokenId })
                    }).catch(err => console.error('Failed to complete session:', err));
                }, 500);
            }

            flushEvents() {
                if (this.events.length === 0) return;

                const eventsToSend = [...this.events];
                this.events = [];

                fetch('/api/events', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token_id: this.tokenId,
                        events: eventsToSend
                    })
                }).catch(err => console.error('Failed to send events:', err));
            }

            destroy() {
                clearInterval(this.batchInterval);
                this.flushEvents();
            }
        }

        // Extract token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            document.getElementById('loading').innerHTML = '<div style="color: #f00;">Error: No game token provided</div>';
        }

        window.gameToken = token;
        window.gameEventHandler = new GameEventHandler(token);

        // Fetch game metadata from token (would be passed by server)
        fetch('/api/health')
            .then(r => r.json())
            .then(() => {
                // Game loaded, hide loading indicator after scene creation
                setTimeout(() => {
                    const loading = document.getElementById('loading');
                    if (loading) loading.style.display = 'none';
                }, 1000);
            })
            .catch(err => console.error('Failed to load game:', err));
    </script>

    <!-- Scene classes will be injected by server -->
    <script id="scene-code"></script>

    <script>
        // Initialize Phaser game
        const config = {
            type: Phaser.AUTO,
            width: Math.max(800, window.innerWidth - 20),
            height: Math.max(600, window.innerHeight - 20),
            parent: 'game',
            scene: [],
            scale: {
                mode: Phaser.Scale.FIT,
                autoCenter: Phaser.Scale.CENTER_BOTH,
            },
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 0 },
                    debug: false
                }
            }
        };

        const game = new Phaser.Game(config);

        // Add scene will be done by server response
        window.addGameScene = function(SceneClass, tokenId) {
            const scene = new SceneClass();
            game.scene.add(SceneClass.name, scene);
            game.scene.start(SceneClass.name, {
                tokenId: tokenId,
                gameEventHandler: window.gameEventHandler
            });
        };
    </script>
</body>
</html>
